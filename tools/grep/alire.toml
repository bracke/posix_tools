name = "posix_tools_grep"
description = "grep command for posix_tools"
version = "0.1.0"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
executables = ["grep"]
project-files = ["posix_tools_grep.gpr"]

[[depends-on]]
posix_tools_common = "*"

[[depends-on]]
greplib = "*"

[[depends-on]]
regexp = "*"

[[depends-on]]
messages = "*"

[[depends-on]]
terminal_styles = "*"

[[pins]]
posix_tools_common = { path = "../../common" }

[[pins]]
greplib = { path = "../../../greplib" }

[[pins]]
regexp = { path = "../../../regexp" }

[[pins]]
messages = { path = "../../../messages" }

[[pins]]
terminal_styles = { path = "../../../terminal_styles" }

[build-profiles]
"*" = "development"
