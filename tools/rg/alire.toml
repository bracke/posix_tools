name = "posix_tools_rg"
description = "ripgrep-compatible recursive search command for posix_tools"
version = "0.1.0"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
executables = ["rg"]
project-files = ["posix_tools_rg.gpr"]

[[depends-on]]
posix_tools_common = "*"

[[depends-on]]
regexp = "*"

[[depends-on]]
versionlib = "*"

[[depends-on]]
greplib = "*"

[[depends-on]]
messages = "*"

[[depends-on]]
terminal_styles = "*"

[[pins]]
posix_tools_common = { path = "../../common" }

[[pins]]
regexp = { path = "../../../regexp" }

[[pins]]
versionlib = { path = "../../../versionlib" }

[[pins]]
greplib = { path = "../../../greplib" }

[[pins]]
messages = { path = "../../../messages" }

[[pins]]
terminal_styles = { path = "../../../terminal_styles" }

[build-profiles]
"*" = "development"
