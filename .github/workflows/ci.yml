name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_runner: ./tests/bin/posix_tools_tests
          - os: macos-15-intel
            test_runner: ./tests/bin/posix_tools_tests
          - os: windows-latest
            test_runner: ./tests/bin/posix_tools_tests.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: posix_tools

      - name: Check out hostkit
        uses: actions/checkout@v7
        with:
          repository: bracke/hostkit
          path: hostkit

      - name: Check out messages
        uses: actions/checkout@v7
        with:
          repository: bracke/messages
          path: messages

      - name: Check out i18n
        uses: actions/checkout@v7
        with:
          repository: bracke/i18n
          path: i18n

      - name: Check out awklib
        uses: actions/checkout@v7
        with:
          repository: bracke/awklib
          path: awklib

      - name: Check out regexp
        uses: actions/checkout@v7
        with:
          repository: bracke/regexp
          path: regexp

      - name: Check out httpclient
        uses: actions/checkout@v7
        with:
          repository: bracke/httpclient
          path: httpclient

      - name: Check out zlib
        uses: actions/checkout@v7
        with:
          repository: bracke/zlib
          path: zlib

      - name: Check out tarlib
        uses: actions/checkout@v7
        with:
          repository: bracke/tarlib
          path: tarlib

      - name: Check out cryptolib
        uses: actions/checkout@v7
        with:
          repository: bracke/cryptolib
          path: cryptolib

      - name: Check out ssllib
        uses: actions/checkout@v7
        with:
          repository: bracke/ssllib
          path: ssllib

      - name: Check out truststores
        uses: actions/checkout@v7
        with:
          repository: bracke/truststores
          path: truststores

      - name: Check out terminal_styles
        uses: actions/checkout@v7
        with:
          repository: bracke/terminal_styles
          path: terminal_styles

      - name: Check out project_tools
        uses: actions/checkout@v7
        with:
          repository: bracke/project_tools
          path: project_tools

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Show Alire version
        run: alr --version
        shell: bash

      - name: Build Ada test/tooling crate
        run: alr -n build
        working-directory: posix_tools/tests
        shell: bash

      - name: Install GNATprove
        run: |
          alr -n install gnatprove
          alire_bin="${HOME}/.alire/bin"
          echo "${alire_bin}" >> "${GITHUB_PATH}"
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "${alire_bin}" >> "${GITHUB_PATH}"
          fi
        shell: bash

      - name: Run Ada release gate
        run: ${{ matrix.test_runner }} release-check
        working-directory: posix_tools
        shell: bash
