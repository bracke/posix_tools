name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_runner: ./tests/bin/posix_tools_tests
          - os: macos-15-intel
            test_runner: ./tests/bin/posix_tools_tests
          - os: windows-latest
            test_runner: ./tests/bin/posix_tools_tests.exe

    steps:
      # Check files out as committed: the package manifest records each
      # file's size and checksum, so a Windows CRLF checkout of a file
      # without an eol attribute would make the regenerated manifest
      # differ from the committed one.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
        shell: bash

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: posix_tools

      - name: Check out hostkit
        uses: actions/checkout@v7
        with:
          repository: bracke/hostkit
          path: hostkit

      - name: Check out messages
        uses: actions/checkout@v7
        with:
          repository: bracke/messages
          path: messages

      - name: Check out i18n
        uses: actions/checkout@v7
        with:
          repository: bracke/i18n
          path: i18n

      - name: Check out awklib
        uses: actions/checkout@v7
        with:
          repository: bracke/awklib
          path: awklib

      - name: Check out greplib
        uses: actions/checkout@v7
        with:
          repository: bracke/greplib
          path: greplib

      - name: Check out sedlib
        uses: actions/checkout@v7
        with:
          repository: bracke/sedlib
          path: sedlib

      - name: Check out regexp
        uses: actions/checkout@v7
        with:
          repository: bracke/regexp
          path: regexp

      - name: Check out httpclient
        uses: actions/checkout@v7
        with:
          repository: bracke/httpclient
          path: httpclient

      - name: Check out zlib
        uses: actions/checkout@v7
        with:
          repository: bracke/zlib
          path: zlib

      - name: Check out tarlib
        uses: actions/checkout@v7
        with:
          repository: bracke/tarlib
          path: tarlib

      - name: Check out tomllib
        uses: actions/checkout@v7
        with:
          repository: bracke/tomllib
          path: tomllib

      - name: Check out cryptolib
        uses: actions/checkout@v7
        with:
          repository: bracke/cryptolib
          path: cryptolib

      - name: Check out ssllib
        uses: actions/checkout@v7
        with:
          repository: bracke/ssllib
          path: ssllib

      - name: Check out truststores
        uses: actions/checkout@v7
        with:
          repository: bracke/truststores
          path: truststores

      - name: Check out terminal
        uses: actions/checkout@v7
        with:
          repository: bracke/terminal
          path: terminal

      - name: Check out terminal_styles
        uses: actions/checkout@v7
        with:
          repository: bracke/terminal_styles
          path: terminal_styles

      - name: Check out project_tools
        uses: actions/checkout@v7
        with:
          repository: bracke/project_tools
          path: project_tools

      # Only the checkouts above need committed line endings. Alire's index,
      # restored from its cache, was cloned with the host's setting, and
      # would otherwise show every CRLF file in it as changed and refuse to
      # update.
      - name: Restore the host's line endings
        run: git config --global --unset core.autocrlf || true
        shell: bash

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Show Alire version
        run: alr --version
        shell: bash

      - name: Build Ada test/tooling crate
        run: alr -n build
        working-directory: posix_tools/tests
        shell: bash

      - name: Install GNATprove
        run: |
          for attempt in 1 2 3; do
            if alr -n install gnatprove; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          alire_bin="${HOME}/.alire/bin"
          echo "${alire_bin}" >> "${GITHUB_PATH}"
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "${alire_bin}" >> "${GITHUB_PATH}"
          fi
        shell: bash

      - name: Run Ada release gate
        run: ${{ matrix.test_runner }} release-check
        working-directory: posix_tools
        shell: bash

      # release-check regenerates the docs, the man pages, the command
      # inventory and the package manifest before checking them, so it
      # cannot see that the committed copies were stale; git can.
      - name: Check committed generated files are current
        run: git diff --exit-code
        working-directory: posix_tools
        shell: bash
