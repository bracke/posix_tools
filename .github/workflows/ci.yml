name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_runner: ./tests/bin/posix_tools_tests
          - os: macos-15-intel
            test_runner: ./tests/bin/posix_tools_tests
          - os: windows-latest
            test_runner: ./tests/bin/posix_tools_tests.exe

    steps:
      # Check files out as committed: the package manifest records each
      # file's size and checksum, so a Windows CRLF checkout of a file
      # without an eol attribute would make the regenerated manifest
      # differ from the committed one.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
        shell: bash

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: posix_tools

      - name: Check out hostkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/hostkit
          ref: 432610a76dddfa3ed15bb74414eb6a1ab0b7b273
          path: hostkit

      - name: Check out messages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/messages
          ref: 6d092f9590c6b0cb0d7704ce20c33b3ac76b8d14
          path: messages

      - name: Check out i18n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/i18n
          ref: 21d4d191f1d90a16248b71dfc54b4384502cf658
          path: i18n

      - name: Check out awklib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/awklib
          ref: 648bd7466e3b36112027c2116326b146224b2e21
          path: awklib

      - name: Check out greplib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/greplib
          ref: d11f89cf5121698a07a852ab4474e17af236b6c6
          path: greplib

      - name: Check out sedlib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/sedlib
          ref: 2c62828278b31cd160df15fd1878a773d37eee95
          path: sedlib

      - name: Check out regexp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/regexp
          ref: f660333a314f3c610bb255478ac86656e2fd0c4c
          path: regexp

      - name: Check out httpclient
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/httpclient
          ref: 4a6847ee9ba01888d945bb77274cbf5bb536cd13
          path: httpclient

      - name: Check out zlib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/zlib
          ref: e2a66961dc1ebb9d90433160a43f78f52f8db9e1
          path: zlib

      - name: Check out tarlib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/tarlib
          ref: 1a6f22ae04e89a2e634d00f283527d337e3d3b1b
          path: tarlib

      - name: Check out tomllib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/tomllib
          ref: e79115f9a823e14435e8bee077cec7fa68f5c1be
          path: tomllib

      - name: Check out cryptolib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/cryptolib
          ref: 2e5c415f65fd49c2a496c97813740fa9b83e02fa
          path: cryptolib

      - name: Check out ssllib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/ssllib
          ref: b1637fa14a30ab60b7ef6800533a88aed5a549bf
          path: ssllib

      - name: Check out truststores
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/truststores
          ref: 90ce36a625ce8687685e0bf98ce279ee0f39c697
          path: truststores

      - name: Check out terminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/terminal
          ref: f6acaba0794f31c93423844eacf89847be989e37
          path: terminal

      - name: Check out terminal_styles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/terminal_styles
          ref: da097e330169ea5d3030efd0207f313ae6262a65
          path: terminal_styles

      - name: Check out project_tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bracke/project_tools
          ref: 4f5357c7c7e8e175054e6f2cb72c302409f371c8
          path: project_tools

      # Only the checkouts above need committed line endings. Alire's index,
      # restored from its cache, was cloned with the host's setting, and
      # would otherwise show every CRLF file in it as changed and refuse to
      # update.
      - name: Restore the host's line endings
        run: git config --global --unset core.autocrlf || true
        shell: bash

      - name: Set up Alire
        uses: alire-project/setup-alire@1ff7d9224297858cc9ecce29b08bc6109f93e49a # v6

      - name: Show Alire version
        run: alr --version
        shell: bash

      - name: Select pinned Ada toolchain
        run: alr toolchain --select --local gnat_native=15.2.1 gprbuild=26.0.1
        working-directory: posix_tools/tests
        shell: bash

      - name: Build Ada test/tooling crate
        run: alr -n build
        working-directory: posix_tools/tests
        shell: bash

      # The prover version the proofs were last checked with locally, so a
      # new release cannot change what the gate proves.
      - name: Install GNATprove
        run: |
          for attempt in 1 2 3; do
            if alr -n install gnatprove=15.1.0; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          alire_bin="${HOME}/.alire/bin"
          echo "${alire_bin}" >> "${GITHUB_PATH}"
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "${alire_bin}" >> "${GITHUB_PATH}"
          fi
        shell: bash

      - name: Run Ada release gate
        run: ${{ matrix.test_runner }} release-check
        working-directory: posix_tools
        shell: bash

      # CreateProcessW has refused grep.exe while GNAT's spawn ran it; .NET
      # names the Win32 error that the release gate cannot see.
      - name: Show why Windows refuses to start a command
        if: failure() && runner.os == 'Windows'
        working-directory: posix_tools
        shell: pwsh
        run: |
          foreach ($name in 'cat', 'grep', 'patch') {
            $exe = Join-Path $PWD "tools\$name\bin\$name.exe"
            $info = New-Object System.Diagnostics.ProcessStartInfo $exe, '--posix-tools-identify'
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            try {
              $process = [System.Diagnostics.Process]::Start($info)
              $output = $process.StandardOutput.ReadToEnd()
              $process.WaitForExit()
              '{0}: started, exit {1:X8}, output {2}' -f $name, $process.ExitCode, ($output -replace "`n", ' ')
            } catch {
              $cause = $_.Exception.GetBaseException()
              '{0}: not started, error {1}: {2}' -f $name, $cause.NativeErrorCode, $cause.Message
            }
          }

      # release-check regenerates the docs, the man pages, the command
      # inventory and the package manifest before checking them, so it
      # cannot see that the committed copies were stale, or that a new one
      # was never added; git can.
      - name: Check committed generated files are current
        run: test -z "$(git status --porcelain)" || { git status; git diff; exit 1; }
        working-directory: posix_tools
        shell: bash
